[package]
name = "denoise"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "CLI autocontenido denoise v1 — elimina ruido de la pista de audio de videos con DeepFilterNet3 ONNX + ort CPU."
readme = "README.md"

[lib]
name = "denoise"
path = "src/lib.rs"

[[bin]]
name = "denoise"
path = "src/main.rs"

[profile.release]
opt-level = 3
strip = true

[dependencies]
clap = { version = "4", features = ["derive"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "copy-dylibs", "download-binaries", "tls-rustls"] }
ndarray = "0.15"
rustfft = "6"
hound = "3"
indicatif = "0.17"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls-webpki-roots"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
home = "0.5"
which = "4"
ctrlc = "3"
sysinfo = "0.30"
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
regex = "1"

[dev-dependencies]
rand = "0.8"
